<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClickCraft — AI YouTube Thumbnail Generator</title>
    <meta name="description" content="Describe your video, choose a visual style, and generate professional YouTube thumbnails with AI in seconds." />
    <meta property="og:title" content="ClickCraft — AI YouTube Thumbnail Generator" />
    <meta property="og:description" content="Describe your video, choose a visual style, and generate professional YouTube thumbnails with AI in seconds." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('clickcraft-theme');
          if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
